<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envoyer une notification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07090f;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 1.5rem;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 60% at 20% 20%, rgba(78, 205, 196, 0.08) 0%, transparent 70%),
          radial-gradient(ellipse 60% 50% at 80% 80%, rgba(167, 139, 250, 0.06) 0%, transparent 70%);
        pointer-events: none;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 440px;
        background: rgba(15, 19, 28, 0.85);
        backdrop-filter: blur(24px) saturate(1.4);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 2rem;
        padding: 2.5rem;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      }
      .icon {
        text-align: center;
        font-size: 2.2rem;
        margin-bottom: 1.25rem;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      h1 {
        color: #eef2f7;
        font-size: 1.3rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 0.4rem;
      }
      .subtitle {
        color: #5a6678;
        font-size: 0.82rem;
        text-align: center;
        margin-bottom: 2rem;
      }
      label {
        display: block;
        color: #8a9bb5;
        font-size: 0.82rem;
        font-weight: 500;
        margin-bottom: 0.4rem;
      }
      input, textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.1rem;
        color: #eef2f7;
        font-family: inherit;
        font-size: 1rem;
        line-height: 1.6;
        padding: 0.9rem 1.2rem;
        outline: none;
        transition: border-color 0.2s, background 0.2s;
      }
      input::placeholder, textarea::placeholder { color: #3d4a5c; }
      input:focus, textarea:focus {
        border-color: rgba(78, 205, 196, 0.4);
        background: rgba(255, 255, 255, 0.06);
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      .field { margin-bottom: 1.2rem; }
      button {
        width: 100%;
        padding: 0.9rem;
        background: linear-gradient(135deg, #4ecdc4, #a78bfa);
        border: none;
        border-radius: 1.1rem;
        color: #fff;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.01em;
        transition: opacity 0.18s, transform 0.18s;
      }
      button:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
      button:active:not(:disabled) { transform: translateY(0); }
      button:disabled { opacity: 0.4; cursor: default; }
      .feedback {
        margin-top: 1.1rem;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
        min-height: 1.3em;
      }
      .feedback.success { color: #4ecdc4; }
      .feedback.error { color: #f87171; }
      @media (max-width: 480px) {
        body { padding: 0.75rem; align-items: flex-start; padding-top: 2rem; }
        .card { border-radius: 1.5rem; padding: 1.5rem; }
        input, textarea { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🔔</div>
      <h1>Envoyer une notification</h1>
      <p class="subtitle">Elle apparaîtra sur l'écran</p>

      <div class="field">
        <label for="title">Titre</label>
        <input id="title" type="text" placeholder="Titre de la notification" maxlength="100" />
      </div>

      <div class="field">
        <label for="body">Message</label>
        <textarea id="body" placeholder="Écris ton message ici…" maxlength="500"></textarea>
      </div>

      <button id="btn" type="button">Envoyer</button>
      <div class="feedback" id="feedback"></div>
    </div>

    <script>
      const titleInput = document.getElementById("title");
      const bodyInput = document.getElementById("body");
      const btn = document.getElementById("btn");
      const feedback = document.getElementById("feedback");

      btn.addEventListener("click", async () => {
        const title = titleInput.value.trim();
        const body = bodyInput.value.trim();
        if (!title && !body) {
          feedback.textContent = "Écris au moins un titre ou un message";
          feedback.className = "feedback error";
          return;
        }

        btn.disabled = true;
        feedback.textContent = "";
        feedback.className = "feedback";

        try {
          const res = await fetch("/api/push/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, body }),
          });

          if (res.ok) {
            feedback.textContent = "Notification envoyée ✓";
            feedback.className = "feedback success";
            titleInput.value = "";
            bodyInput.value = "";
          } else {
            const err = await res.json();
            feedback.textContent = err.error || "Erreur lors de l'envoi";
            feedback.className = "feedback error";
          }
        } catch {
          feedback.textContent = "Impossible de joindre le serveur";
          feedback.className = "feedback error";
        } finally {
          btn.disabled = false;
        }
      });

      bodyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) btn.click();
      });
    </script>
  </body>
</html>
